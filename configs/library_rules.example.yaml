    weight: 1.0
  - name: Science
    weight: 1.0
  - name: Cell
    weight: 1.0
  - name: NeurIPS
    weight: 0.99
  - name: ICML
    weight: 0.99
  - name: ICLR
    weight: 0.99
  - name: CVPR
    weight: 0.97
  - name: ICCV
    weight: 0.96
  - name: ECCV
    weight: 0.95
  - name: ACL
    weight: 0.96
