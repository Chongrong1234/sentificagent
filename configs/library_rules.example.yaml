  - openalex
  - arxiv
  - semantic-scholar
  field_weights:
    title: 5.0
    abstract: 3.0
    keywords: 4.0
    authors: 1.8
    venue: 4.5
  bonuses:
    topic_weight_multiplier: 5.0
    venue_weight_multiplier: 6.0
    venue_tier_weight_multiplier: 4.0
    team_match_bonus: 2.0
    pdf_available_bonus: 1.0
  thresholds:
    download_min_score: 3.0
attention:
  query: large language model multimodal chain of thought debate crop growth model
    artificial intelligence agriculture remote sensing
  include_search: false
  max_results: 80
  summarize_min_score: 3.0
