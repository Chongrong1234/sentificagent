<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Scientific Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #edf3ed;
        --paper: rgba(255, 252, 241, 0.9);
        --ink: #13251f;
        --muted: #60706a;
        --line: rgba(19, 37, 31, 0.16);
        --accent: #0f7a5b;
        --accent-strong: #064b3c;
        --gold: #c98e22;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 390px;
        margin: 0;
        padding: 14px;
        color: var(--ink);
        font: 13px/1.5 "Noto Serif SC", "Microsoft YaHei", serif;
        background:
          radial-gradient(circle at 90% 0%, rgba(201, 142, 34, 0.24), transparent 36%),
          radial-gradient(circle at 8% 20%, rgba(15, 122, 91, 0.18), transparent 34%),
          linear-gradient(180deg, #f6f8ef 0%, var(--bg) 100%);
      }

      .panel {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--paper);
        box-shadow: 0 18px 50px rgba(21, 43, 35, 0.16);
      }

      .header {
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent-strong);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .paper-summary {
        margin: 12px 0 0;
        padding: 12px;
        border: 1px solid rgba(19, 37, 31, 0.12);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.52);
        color: var(--muted);
        white-space: pre-wrap;
      }

      .body {
        padding: 16px 18px 18px;
      }

      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 900;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--ink);
        font: inherit;
        outline: none;
      }

      input {
        min-height: 38px;
        padding: 0 11px;
      }

      textarea {
        min-height: 58px;
        padding: 9px 11px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: rgba(15, 122, 91, 0.72);
        box-shadow: 0 0 0 3px rgba(15, 122, 91, 0.1);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        min-height: 38px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
      }

      button.secondary {
        border: 1px solid rgba(15, 122, 91, 0.2);
        background: rgba(15, 122, 91, 0.1);
        color: var(--accent-strong);
      }

      .queue-action {
        grid-template-columns: 1fr;
      }

      #status {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid rgba(19, 37, 31, 0.12);
        border-radius: 16px;
        background: rgba(9, 28, 23, 0.84);
        color: #eaffed;
        font-family: "JetBrains Mono", "Cascadia Code", monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }

      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <p class="eyebrow">Browser Layer / Capture</p>
        <h1>文献接入节点</h1>
        <div class="paper-summary" id="paperSummary">Loading current page...</div>
      </div>

      <div class="body">
        <label for="serverUrl">本地服务</label>
        <input id="serverUrl" type="text" value="http://127.0.0.1:8765">

        <label for="team">研究团队覆盖</label>
        <input id="team" type="text" placeholder="Optional">

        <label for="venueTier">会议/期刊等级覆盖</label>
        <input id="venueTier" type="text" placeholder="Optional">

        <label for="keywords">手动标签</label>
        <textarea id="keywords" placeholder="Comma-separated labels"></textarea>

        <div class="actions">
          <button class="secondary" id="captureOnly">只采集</button>
          <button id="captureAndDownload">采集并下载</button>
        </div>

        <div class="actions queue-action">
          <button class="secondary" id="processQueue">运行下载队列</button>
        </div>

        <div id="status"></div>
        <p class="hint">插件负责把当前论文页接入本地系统，并按分级存储路径下载 PDF，以复用浏览器登录态、校园网和 VPN。</p>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
